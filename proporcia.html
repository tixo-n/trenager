<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пропорция — тренажёр</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#172b4d;font:clamp(16px,2.1vw,32px) Arial,sans-serif;min-height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:1vh 3vw;background:#172b4d;color:white}h1{font-size:1.3em;margin:0}button,select,input{font:inherit;border-radius:12px;padding:.55em .85em;border:1px solid #bacbe0}button{cursor:pointer;background:white;color:#172b4d;font-weight:bold}button.active,button.primary{background:#245bc4;color:white;border-color:#245bc4}nav,.toolbar,.actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:1vh}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;border-radius:24px;margin:0 3vw 2vh;padding:2vh 2vw;text-align:center;gap:1.6vh}#question{font-size:1.15em;max-width:95%;margin:0}#expression{display:flex;align-items:center;justify-content:center;gap:.6em;font-size:2.8em;font-weight:bold;min-height:1.9em}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;min-width:1.15em;line-height:1.1}.frac>span:first-child{border-bottom:.055em solid currentColor;padding:0 .18em .07em}.frac>span:last-child{padding:.07em .18em 0}.blue{color:#235dc4}.orange{color:#c35a13}.green{color:#14804a}#hint{min-height:1.4em;color:#405879;font-size:1em}#feedback{min-height:1.3em;font-weight:bold}input{width:7em;text-align:center}#theory{max-width:1100px;line-height:1.4}#theory p{margin:.25em}#score{font-size:.8em}button:focus-visible,input:focus-visible{outline:4px solid #f2b441} [hidden]{display:none!important}@media(max-width:700px){nav button{font-size:.8em}#expression{font-size:2.3em}main{margin:0 1vw 1vh}}
</style></head><body><header><h1>Пропорция · 6 класс</h1><span id="score">Решено: 0 · Верно: 0</span><button onclick="fullscreen()">⛶ Экран</button></header><nav id="nav"><button onclick="mode('learn')">Обучение</button><button onclick="mode('verify')">Верно или неверно</button><button onclick="mode('find')">Найди x</button><button onclick="mode('word')">Задачи</button></nav><div class="toolbar" id="tools"><label>Сложность <select id="level" onchange="next()"><option value="1">1 — легко</option><option value="2">2 — средне</option><option value="3">3 — сложнее</option></select></label><button onclick="resetScore()">Сброс счёта</button></div><main><p id="question"></p><div id="expression"></div><div id="theory" hidden></div><div class="actions" id="answers"><input id="answer" inputmode="decimal" placeholder="Ответ" aria-label="Ответ"><button class="primary" id="check" onclick="check()">Проверить</button><button id="yes" onclick="check(true)">Верно</button><button id="no" onclick="check(false)">Неверно</button></div><div id="hint"></div><div id="feedback" aria-live="polite"></div><div class="actions"><button id="help" onclick="hint()">Подсказка</button><button class="primary" id="next" onclick="next()">Следующее задание →</button></div></main><script>
const $=id=>document.getElementById(id);let current='learn',task=null,done=false,total=0,right=0,step=0,lesson=0,last='';const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const fmt=n=>String(n).replace('.',',');const gcd=(a,b)=>b?gcd(b,a%b):a;function frac(a,b){return `<span class="frac"><span>${a}</span><span>${b}</span></span>`}function show(v,colors=false){let z=v.map((x,i)=>`<span class="${colors?(i===0||i===3?'blue':'orange'):''}">${typeof x==='number'?fmt(x):x}</span>`);$('expression').innerHTML=frac(z[0],z[1])+' = '+frac(z[2],z[3]);}function mode(m){current=m;last='';lesson=0;[...$('nav').children].forEach((b,i)=>b.classList.toggle('active',['learn','verify','find','word'][i]===m));next()}function resetScore(){total=right=0;score()}function score(){$('score').textContent=`Решено: ${total} · Верно: ${right}`}function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});}
const lessons=[['Что такое пропорция?',[6,3,10,5],'Пропорция — равенство двух отношений.','6 : 3 = 2 и 10 : 5 = 2'],['Крайние и средние члены',[6,3,10,5],'<span class="blue">Крайние: 6 и 5.</span> <span class="orange">Средние: 3 и 10.</span>','Крайние стоят по краям, средние — в середине.'],['Основное свойство',[6,3,10,5],'<span class="blue">6 · 5</span> = <span class="orange">3 · 10</span>','30 = 30. Умножаем крест-накрест!'],['Как найти x?',['x',4,15,6],'x = (4 · 15) : 6 = 10','Два известных числа по диагонали умножаем, на третье делим.']];
function next(){done=false;step=0;$('hint').innerHTML='';$('feedback').textContent='';$('answer').value='';$('answer').disabled=false;['check','yes','no'].forEach(i=>$(i).disabled=false);let learn=current==='learn';$('tools').hidden=learn;$('theory').hidden=!learn;$('answers').hidden=learn;$('help').hidden=learn;$('next').textContent=learn?'Следующий слайд →':'Следующее задание →';if(learn){let l=lessons[lesson++%lessons.length];$('question').textContent=l[0];show(l[1],true);$('theory').innerHTML=`<p><b>${l[2]}</b></p><p>${l[3]}</p>`;return}let lev=+$('level').value;let sig;do{let a=rand(2,lev===1?7:lev===2?12:19),b=rand(2,lev===1?8:lev===2?13:21),k=rand(2,lev===1?4:lev===2?7:9);let v=[a,b,a*k,b*k];if(rand(0,1))v=[v[2],v[3],v[0],v[1]];if(lev===3)v=v.map(n=>n/10);if(current==='verify'){if(rand(0,1))v[3]=Math.round((v[3]+(lev===3?.2:2))*10)/10;task={v,ans:Math.abs(v[0]*v[3]-v[1]*v[2])<1e-8};}else if(current==='find'){let pos=rand(0,3),ans=v[pos];v[pos]='x';task={v,pos,ans};}else{let n=rand(2,6),m=n+rand(1,5),price=rand(3,lev===1?9:lev===2?30:60)*5;let item=['тетрадей','ручек','карандашей'][rand(0,2)];task={v:[n,m,n*price,'x'],pos:3,ans:m*price,word:`Стоимость ${n} ${item} — ${n*price} руб. Сколько стоят ${m} таких же предметов?`};}sig=JSON.stringify(task)}while(sig===last);last=sig;$('answer').hidden=current==='verify';$('check').hidden=current==='verify';$('yes').hidden=current!=='verify';$('no').hidden=current!=='verify';$('question').textContent=current==='verify'?'Является ли равенство верной пропорцией?':current==='find'?'Найдите неизвестный член пропорции.':task.word;if(current==='word')$('expression').innerHTML='';else show(task.v)}
function hint(){step++;let v=task.v;show(v,true);if(current==='verify'){let p=Math.round(v[0]*v[3]*100)/100,q=Math.round(v[1]*v[2]*100)/100;$('hint').innerHTML=step===1?'Умножь крайние и средние члены.':`${fmt(v[0])} · ${fmt(v[3])} = ${fmt(p)}; &nbsp; ${fmt(v[1])} · ${fmt(v[2])} = ${fmt(q)}`;}else{let p=task.pos,other=3-p,pair=[0,1,2,3].filter(i=>i!==p&&i!==other);$('hint').innerHTML=step===1?'Умножь два известных числа по диагонали и раздели на третье.':`x = ${frac(fmt(v[pair[0]])+' · '+fmt(v[pair[1]]),fmt(v[other]))}`;}}
function parse(s){s=s.trim().replace(',','.');if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);if(/^\d+\s*\/\s*\d+$/.test(s)){let [a,b]=s.split('/').map(Number);return a/b}return NaN}function check(value){if(done)return;let val=current==='verify'?value:parse($('answer').value);if(current!=='verify'&&!Number.isFinite(val)){$('feedback').textContent='Введите число.';$('feedback').style.color='#c35a13';return}let ok=current==='verify'?val===task.ans:Math.abs(val-task.ans)<1e-8;done=true;total++;if(ok)right++;score();$('feedback').style.color=ok?'#14804a':'#b42318';$('feedback').textContent=ok?'✓ Правильно!':'Не совсем. Правильный ответ: '+(current==='verify'?(task.ans?'верно':'неверно'):fmt(task.ans)+(current==='word'?' руб.':''));['check','yes','no','answer'].forEach(i=>$(i).disabled=true);if(!ok){step=1;hint()}}$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});mode('learn');
</script></body></html>
