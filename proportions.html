<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пропорциональные зависимости</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#172c46;font:20px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(25px,3vw,40px);margin:0 0 18px}h2{margin:0 0 12px}button,a.home{font:inherit;border:0;border-radius:12px;padding:12px 20px;background:#e0e9f5;color:#183653;cursor:pointer;text-decoration:none}button.active,button.primary{background:#205bb5;color:white}button:focus-visible,input:focus-visible{outline:3px solid #e5a000}nav,.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}section{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 24px #18365312;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metric{background:#f1f6fc;padding:18px;border-radius:16px}.number{font-size:clamp(30px,5vw,58px);font-weight:800}.track{height:16px;background:#dce6f1;border-radius:10px;overflow:hidden}.bar{height:100%;background:#2773cf;border-radius:10px;transition:width .2s}.second .bar{background:#008878}input[type=range]{width:100%;accent-color:#205bb5;height:35px}.visual{height:230px;display:flex;align-items:center;justify-content:center;background:#f7fafc;border-radius:16px;margin:18px 0;overflow:hidden}.rule{font-size:25px;font-weight:700;color:#174f94}.muted{color:#52667e}.feedback{padding:16px;border-radius:12px;background:#eef5ff;margin:15px 0}.good{color:#08734e}.bad{color:#b33434}svg{width:100%;height:100%}.hidden{display:none}#question{font-size:clamp(24px,3vw,36px);line-height:1.5}button:disabled{opacity:.55;cursor:default}@media(max-width:650px){main{padding:12px}section{padding:16px}.grid{gap:8px}.metric{padding:10px}button{padding:10px;font-size:17px}.visual{height:190px}}
</style></head><body><main><header><h1>Пропорциональные зависимости</h1><a class="home" href="index.html" title="На главную">⌂</a></header><nav><button id="simTab" class="active" onclick="page(false)">🔬 Симуляторы</button><button id="quizTab" onclick="page(true)">🎯 Тренажёр</button></nav><section id="sim"><div class="buttons" id="topics"><button onclick="choose(0)">🚗 Движение</button><button onclick="choose(1)">📐 Прямоугольник</button><button onclick="choose(2)">🛒 Покупки</button></div><div class="buttons" id="modes"><button onclick="mode(false)">Прямая зависимость</button><button onclick="mode(true)">Обратная зависимость</button></div><h2 id="fixed"></h2><label id="sliderLabel" for="slider"></label><input id="slider" type="range" min="1" max="6" step="1" value="2" oninput="draw()"><div class="grid"><div class="metric"><div id="aLabel"></div><div class="number" id="aValue"></div><div class="track"><div class="bar" id="aBar"></div></div></div><div class="metric second"><div id="bLabel"></div><div class="number" id="bValue"></div><div class="track"><div class="bar" id="bBar"></div></div></div></div><div class="visual" id="visual"></div><div class="rule" id="rule"></div><p id="compare"></p><div id="formula" class="muted"></div></section><section id="quiz" class="hidden"><div id="progress" class="muted"></div><h2 id="question"></h2><div class="buttons" id="answers"><button onclick="answer(0)">↗↗ Прямая</button><button onclick="answer(1)">↗↘ Обратная</button><button onclick="answer(2)">Ни та ни другая</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="buttons"><button id="next" class="primary hidden" onclick="advance()">Следующее задание →</button><button id="quizTab" onclick="start()">Начать заново</button></div></section></main><script>
// Данные шести режимов: названия, единицы, постоянная величина и формулы.
const configs=[
[{a:'Скорость',au:'км/ч',b:'Расстояние',bu:'км',fixed:'Время постоянно: 2 часа',x:n=>n*10,y:x=>2*x,f:'S = v · 2',k:2},{a:'Скорость',au:'км/ч',b:'Время',bu:'ч',fixed:'Расстояние постоянно: 120 км',x:n=>n*10,y:x=>120/x,f:'t = 120 : v',k:120}],
[{a:'Длина',au:'см',b:'Площадь',bu:'см²',fixed:'Ширина постоянна: 4 см',x:n=>n*2,y:x=>4*x,f:'S = a · 4',k:4},{a:'Длина',au:'см',b:'Ширина',bu:'см',fixed:'Площадь постоянна: 24 см²',x:n=>n*2,y:x=>24/x,f:'b = 24 : a',k:24}],
[{a:'Количество',au:'шт.',b:'Стоимость',bu:'₽',fixed:'Цена постоянна: 30 ₽ за штуку',x:n=>n*2,y:x=>30*x,f:'C = 30 · n',k:30},{a:'Цена',au:'₽',b:'Количество',bu:'шт.',fixed:'Сумма денег постоянна: 120 ₽',x:n=>[10,12,15,20,30,60][n-1],y:x=>120/x,f:'n = 120 : p',k:120}]];
const $=id=>document.getElementById(id);let topic=0, inverse=false,previous=null;const fmt=x=>Number(x.toFixed(2)).toLocaleString('ru-RU');
function page(q){$('sim').classList.toggle('hidden',q);$('quiz').classList.toggle('hidden',!q);$('simTab').classList.toggle('active',!q);$('quizTab').classList.toggle('active',q)}
function choose(t){topic=t;reset()}function mode(v){inverse=v;reset()}function reset(){previous=null;$('slider').value=2;draw()}
function draw(){const c=configs[topic][+inverse],n=+$('slider').value,x=c.x(n),y=c.y(x);[...$('topics').children].forEach((b,i)=>b.classList.toggle('active',i===topic));[...$('modes').children].forEach((b,i)=>b.classList.toggle('active',i===+inverse));$('fixed').textContent=c.fixed;$('sliderLabel').textContent='Изменяй величину: '+c.a.toLowerCase();$('aLabel').textContent=c.a;$('bLabel').textContent=c.b;const arrow=(v,p)=>p==null?'':v>p?' ↑':v<p?' ↓':'';$('aValue').textContent=fmt(x)+' '+c.au+arrow(x,previous?.x);$('bValue').textContent=fmt(y)+' '+c.bu+arrow(y,previous?.y);$('aBar').style.width=100*x/c.x(6)+'%';$('bBar').style.width=100*y/Math.max(c.y(c.x(1)),c.y(c.x(6)))+'%';$('rule').textContent=inverse?'↑ Одна величина растёт — другая уменьшается ↓':'↑ Одна величина растёт — другая растёт ↑';$('formula').textContent=c.f+' = '+fmt(y)+' '+c.bu+' • '+(inverse?'Произведение постоянно: '+c.k:'Отношение второй величины к первой постоянно: '+c.k);$('compare').textContent=previous&&previous.x!==x?'Первая величина '+(x>previous.x?'увеличилась':'уменьшилась')+' в '+fmt(Math.max(x/previous.x,previous.x/x))+' раза, вторая '+(y>previous.y?'увеличилась':'уменьшилась')+' во столько же раз.':'Передвинь бегунок и сравни изменения.';previous={x,y};visual(x,y,c)}
function visual(x,y,c){let s='';if(topic===0){let len=inverse?540:540*y/120;s=`<path d="M50 145 H590" stroke="#d1dce8" stroke-width="24" stroke-linecap="round"/><path d="M50 145 H${50+len}" stroke="#2773cf" stroke-width="8"/><text x="${Math.min(550,50+len)}" y="127" font-size="44" text-anchor="middle">🚗</text><text x="320" y="42" text-anchor="middle" font-size="24">${inverse?'Один и тот же путь: 120 км':'Пройденный путь: '+fmt(y)+' км'}</text><text x="320" y="205" text-anchor="middle" font-size="22">${inverse?'⏱ Время: '+fmt(y)+' ч':'⏱ Время: 2 ч'}</text>`}else if(topic===1){let w=x*15,h=(inverse?y:4)*15;s=`<rect x="${320-w/2}" y="${110-h/2}" width="${w}" height="${h}" fill="#a9ded7" stroke="#008878" stroke-width="3"/><text x="320" y="${105-h/2}" text-anchor="middle" font-size="18">${x} см</text><text x="${330+w/2}" y="115" font-size="18">${fmt(inverse?y:4)} см</text><text x="320" y="220" text-anchor="middle" font-size="21">Площадь: ${fmt(inverse?24:y)} см²</text>`}else{let count=inverse?y:x;for(let i=0;i<count;i++)s+=`<text x="${90+(i%6)*90}" y="${80+Math.floor(i/6)*65}" font-size="42" text-anchor="middle">🍎</text>`;s+=`<text x="320" y="215" text-anchor="middle" font-size="23">${count} шт. × ${inverse?x:30} ₽ = ${inverse?120:y} ₽</text>`}$('visual').innerHTML=`<svg viewBox="0 0 640 235" role="img" aria-label="Наглядная модель зависимости">${s}</svg>`}
// Банк заданий: 0 — прямая, 1 — обратная, 2 — ни одна.
const bank=[['При одинаковой цене тетради увеличивают число купленных тетрадей. Как связаны количество и стоимость?',0,'Стоимость равна цене, умноженной на количество.'],['Автомобиль едет один и тот же путь. Как связаны скорость и время?',1,'Время равно расстоянию, делённому на скорость.'],['Ширина прямоугольника неизменна. Как связаны длина и площадь?',0,'Площадь равна длине, умноженной на постоянную ширину.'],['Площадь прямоугольника неизменна. Как связаны длина и ширина?',1,'Произведение длины и ширины постоянно.'],['На одну и ту же сумму покупают яблоки. Как связаны цена за килограмм и масса покупки?',1,'Масса равна сумме денег, делённой на цену.'],['Поезд движется с постоянной скоростью. Как связаны время и расстояние?',0,'Расстояние равно постоянной скорости, умноженной на время.'],['Одинаковую работу выполняют рабочие с одинаковой производительностью. Как связаны число рабочих и время работы?',1,'При удвоении числа рабочих время уменьшается вдвое.'],['Как связаны сторона квадрата и его периметр?',0,'Периметр равен четырём сторонам.'],['Как связаны сторона квадрата и его площадь?',2,'При удвоении стороны площадь увеличивается в четыре раза, а не в два.'],['В каждый пакет кладут по 5 конфет. Как связаны число пакетов и число конфет?',0,'Число конфет равно числу пакетов, умноженному на 5.'],['Один и тот же объём воды разливают поровну по бутылкам. Как связаны число бутылок и объём воды в каждой?',1,'Произведение числа бутылок на объём в каждой постоянно.'],['Такси берёт 100 рублей за посадку и 20 рублей за километр. Как связаны расстояние и полная стоимость?',2,'Есть постоянная плата за посадку, поэтому отношение стоимости к расстоянию не постоянно.'],['При неизменном времени движения как связаны скорость и путь?',0,'Путь равен скорости, умноженной на постоянное время.'],['Запас корма делят поровну между животными. Как связаны число животных и порция?',1,'Общий запас постоянен.'],['Как связаны возраст ребёнка и его рост?',2,'Рост не изменяется в постоянное число раз вместе с возрастом.']];
let order=[],idx=0,score=0,locked=false;const names=['Прямая','Обратная','Ни та ни другая'];function start(){order=[...bank];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}order=order.slice(0,10);idx=0;score=0;show()}function show(){locked=false;$('progress').textContent=`Задание ${idx+1} из ${order.length} • Верно: ${score}`;$('question').textContent=order[idx][0];$('answers').classList.remove('hidden');[...$('answers').children].forEach(b=>{b.disabled=false;b.classList.remove('active')});$('feedback').classList.add('hidden');$('next').classList.add('hidden')}function answer(a){if(locked)return;locked=true;let q=order[idx],ok=a===q[1];if(ok)score++;[...$('answers').children].forEach((b,i)=>{b.disabled=true;b.classList.toggle('active',i===q[1])});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=(ok?'Верно! ':'Не совсем. Правильный ответ: '+names[q[1]]+'. ')+q[2];$('next').classList.remove('hidden');$('next').textContent=idx===order.length-1?'Показать результат':'Следующее задание →'}function advance(){if(!locked)return;if(++idx<order.length){show();return}$('progress').textContent='Тренировка завершена';$('question').textContent=`Результат: ${score} из ${order.length} (${score*10}%)`;$('answers').classList.add('hidden');$('next').classList.add('hidden');$('feedback').className='feedback';$('feedback').textContent=score===10?'Отлично! Все зависимости определены верно.':'Можно повторить симуляторы и попробовать ещё раз.'}reset();start();
</script></body></html>
