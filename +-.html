<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Тренажёр: положительные и отрицательные числа</title>
<style>

  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 20px;
    color: #1f2937;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    background: #fff;

    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }

  .bar {

  .bar b { color: #4338ca; }

  .settings {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 12px; font-size: 14px;
  }
  .settings label { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #374151; }
  .settings select {
    padding: 8px 10px; font-size: 14px; border: 2px solid #d1d5db;
    border-radius: 8px; background: #fff; cursor: pointer;
  }
  .settings select:focus { border-color: #4338ca; outline: none; }
  .hidden { display: none !important; }

  .modes {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .modes button {
    padding: 10px 14px; font-size: 14px; border-radius: 10px; cursor: pointer;
    font-weight: 600; border: 2px solid #d1d5db; background: #fff; color: #374151;

  .task .num { font-weight: 700; color: #9ca3af; min-width: 26px; }
  .task .expr { font-size: 19px; font-weight: 600; letter-spacing: .3px; }
  .task input {
    width: 160px; padding: 8px 10px; font-size: 16px;
    border: 2px solid #d1d5db; border-radius: 8px; outline: none;
    text-align: center;
  }
  .task input:focus { border-color: #4338ca; }

  .sign-btns { display: inline-flex; gap: 6px; }
  .sign-btns button {
    min-width: 46px; padding: 8px 12px; font-size: 16px; font-weight: 700;
    border: 2px solid #d1d5db; background: #fff; border-radius: 8px;
    cursor: pointer; color: #374151;
  }
  .sign-btns button.sel {
    border-color: #4338ca; background: #eef2ff; color: #3730a3;
  }

  .task.ok { background: #f0fdf4; border-color: #86efac; }
  .task.err { background: #fef2f2; border-color: #fca5a5; }
  .task .mark { font-size: 18px; font-weight: 700; }
  .ok .mark { color: #16a34a; }
  .err .mark { color: #dc2626; }
  .task .answer { font-size: 14px; color: #6b7280; margin-left: auto; }
  .task .answer b { color: #b91c1c; }
  .task .errtype { font-size: 13px; color: #b91c1c; font-weight: 600; }

  /* ---------- ПРОВЕРОЧНЫЙ РЕЖИМ ---------- */
  .quiz-wrap { padding: 10px 0 4px; }
  .quiz-counter {
    font-size: 14px; color: #6b7280; margin-bottom: 14px; text-align: center;
  }
  .quiz-counter b { color: #4338ca; font-size: 16px; }
  .quiz-expr {
    font-size: 36px; font-weight: 700; text-align: center;
    padding: 30px 16px; background: #f8fafc; border-radius: 14px;
    border: 1px solid #e5e7eb; margin: 0 auto 22px; letter-spacing: .5px;
    max-width: 640px;
  }
  .quiz-row {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; flex-wrap: wrap;
    max-width: 640px; margin: 0 auto;
  }
  .quiz-row input {
    width: 220px; padding: 14px 16px; font-size: 22px;
    border: 2px solid #d1d5db; border-radius: 12px; outline: none;
    text-align: center; font-weight: 600;
  }
  .quiz-row input:focus { border-color: #4338ca; }
  .quiz-row > button {
    padding: 14px 24px; font-size: 17px; border: none; border-radius: 12px;
    background: #4338ca; color: #fff; font-weight: 700; cursor: pointer;
  }
  .quiz-row > button:hover { background: #3730a3; }
  .quiz-sign-btns { display: inline-flex; gap: 10px; }
  .quiz-sign-btns button {
    min-width: 84px; padding: 14px 20px; font-size: 20px; font-weight: 800;
    border: 2px solid #d1d5db; background: #fff; color: #374151;

  }
  .quiz-sign-btns button:hover { border-color: #9ca3af; }
  .quiz-sign-btns button.sel {
    border-color: #4338ca; background: #eef2ff; color: #3730a3;
  }
  .quiz-feedback {
    text-align: center; font-size: 18px; font-weight: 700;
    margin: 18px auto 0; min-height: 52px; max-width: 640px;
    line-height: 1.4;
  }
  .quiz-feedback.ok { color: #16a34a; }
  .quiz-feedback.err { color: #dc2626; }
  .quiz-feedback .small { font-size: 16px; font-weight: 700; color: #111827; }
  .quiz-feedback .tag { font-size: 13px; font-weight: 700; color: #6b7280; }

  /* ---------- РЕЗУЛЬТАТ ---------- */
  .btns { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  button.primary {
    padding: 12px 20px; font-size: 15px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; background: #4338ca; color: #fff;
  }
  button.primary:hover { background: #3730a3; }
  button.ghost {
    padding: 12px 20px; font-size: 15px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; background: #e5e7eb; color: #374151;
  }
  button.ghost:hover { background: #d1d5db; }
  button:disabled { opacity: .55; cursor: not-allowed; }

  .result {
    margin-top: 18px; padding: 16px; border-radius: 12px;
    font-size: 16px; display: none;
  }
  .result.show { display: block; }
  .result.good { background: #f0fdf4; color: #166534; }
  .result.bad { background: #fef2f2; color: #991b1b; }
  .result.warn { background: #fffbeb; color: #92400e; }
  .stats { margin-top: 10px; font-size: 15px; line-height: 1.7; }
  .stats b { font-weight: 700; }
  .errsplit {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.55); font-size: 14px;
  }
  .errsplit .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .errsplit .bad { color: #b91c1c; font-weight: 700; }
  .grade {
    display: inline-block; margin-top: 12px; padding: 6px 16px;
    border-radius: 999px; font-weight: 800; font-size: 20px;
  }
  .grade.g5 { background: #dcfce7; color: #166534; }
  .grade.g4 { background: #dbeafe; color: #1e40af; }
  .grade.g3 { background: #fef3c7; color: #92400e; }
  .grade.g2 { background: #fee2e2; color: #991b1b; }

 <a class="back-home" href="index.html" aria-label="В главное меню" title="В главное меню">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

<div class="container">
  <h1>➕➖ Тренажёр: положительные и отрицательные числа</h1>
  <div class="sub">
    Ответ вводите в одно поле. Целое — <code>-4</code>.
    Десятичная дробь — с <b>запятой</b>: <code>-2,5</code> (можно и с точкой).
    Обыкновенная дробь — <b>через слеш</b>: <code>-3/4</code>.
  </div>

  <div class="settings">
    <label>Задание:
      <select id="taskType">
        <option value="sign">Определи знак</option>
        <option value="calc" selected>Вычисли</option>
      </select>
    </label>
    <label id="sectionLabel">Раздел:
      <select id="section">
        <option value="addsub" selected>Сложение и вычитание</option>
        <option value="muldiv">Умножение и деление</option>
        <option value="all">Все действия</option>
      </select>
    </label>
    <label>Уровень:
      <select id="level">
        <option value="easy">Лёгкий (целые)</option>
        <option value="medium" selected>Средний (+ десятичные)</option>
        <option value="hard">Сложный (+ обыкн. дроби)</option>
      </select>
    </label>
    <label>Заданий:
      <select id="count">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
        <option value="20">20</option>
      </select>
    </label>
  </div>

  <div class="modes">
    <button id="mode-training" class="active" data-mode="training">📋 Тренировочный (списком)</button>
    <button id="mode-quiz" data-mode="quiz">🎯 Проверочный (по одному)</button>
  </div>

  <div class="bar">
    <span>Решено: <b id="solved">0</b> / <span id="totalCount">10</span></span>
    <div class="progress"><div id="pbar"></div></div>
    <span>Верно: <b id="correct">0</b></span>
  </div>

  <!-- ТРЕНИРОВОЧНЫЙ РЕЖИМ -->
  <div id="trainingWrap">
    <div id="tasks"></div>
    <div class="btns">
      <button id="check" class="primary">Проверить</button>
      <button id="reset" class="ghost">Пройти заново</button>
    </div>
  </div>

  <!-- ПРОВЕРОЧНЫЙ РЕЖИМ -->
  <div id="quizWrap" class="quiz-wrap hidden">
    <div class="quiz-counter">Задание <b id="qCurrent">1</b> из <b id="qTotal">10</b></div>
    <div class="quiz-expr" id="qExpr">—</div>
    <div class="quiz-row" id="qRow"></div>
    <div class="quiz-feedback" id="qFeedback"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
// ==========================================================
//  МАТЕМАТИКА: рациональные числа через {n, d}, d > 0, сокращено
// ==========================================================
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); return b ? gcd(b, a % b) : a; }

function makeFrac(n, d) {
  if (d < 0) { n = -n; d = -d; }
  if (n === 0) return { n: 0, d: 1 };
  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
}
function addF(a, b) { return makeFrac(a.n * b.d + b.n * a.d, a.d * b.d); }
function subF(a, b) { return makeFrac(a.n * b.d - b.n * a.d, a.d * b.d); }
function mulF(a, b) { return makeFrac(a.n * b.n, a.d * b.d); }
function divF(a, b) { return makeFrac(a.n * b.d, a.d * b.n); }
function isZero(a) { return a.n === 0; }
function isPositive(a) { return a.n > 0; }
function isNegative(a) { return a.n < 0; }
function signOf(a) { return a.n > 0 ? 1 : a.n < 0 ? -1 : 0; }
function isEqualF(a, b) { return a.n * b.d === b.n * a.d; }

// Парсинг ответа: целое, десятичное (запятая/точка), обыкновенная дробь (слеш)
function parseAnswer(raw) {
  if (!raw) return null;
  let s = String(raw).trim().replace(/\s+/g, '');
  if (s === '') return null;
  if (s.includes('/')) {
    const m = s.match(/^(-?\d+)\/(\d+)$/);
    if (!m) return null;
    const n = parseInt(m[1], 10);
    const d = parseInt(m[2], 10);
    if (isNaN(n) || isNaN(d) || d === 0) return null;
    return makeFrac(n, d);
  }
  s = s.replace(',', '.');
  const m = s.match(/^(-?)(\d*)(?:\.(\d*))?$/);
  if (!m) return null;
  const sign = m[1] === '-' ? -1 : 1;
  const intPart = m[2] || '0';
  const fracPart = m[3] || '';
  if (intPart === '' && fracPart === '') return null;
  const scale = fracPart.length;
  let i = parseInt(intPart + fracPart || '0', 10);
  if (isNaN(i)) return null;
  i *= sign;
  return makeFrac(i, Math.pow(10, scale));
}

function fracToStr(f) {
  if (!f) return '—';
  if (f.d === 1) return String(f.n);
  let d = f.d;
  while (d % 2 === 0) d /= 2;
  while (d % 5 === 0) d /= 5;
  if (d === 1) {
    const neg = f.n < 0;
    let n = Math.abs(f.n);
    let scale = 0, dd = f.d;
    while (dd % 2 === 0) { dd /= 2; scale++; }
    while (dd % 5 === 0) { dd /= 5; scale++; }
    const pow = Math.pow(10, scale);
    const val = Math.round(n * pow / f.d);
    let s = String(val).padStart(scale + 1, '0');
    let out = scale === 0 ? s : s.slice(0, s.length - scale) + ',' + s.slice(s.length - scale);
    out = out.replace(/0+$/, '').replace(/,$/, '');
    if (out === '') out = '0';
    return (neg ? '-' : '') + out;
  }
  return f.n + '/' + f.d;
}

// ==========================================================
//  ГЕНЕРАЦИЯ
// ==========================================================
const LEVEL_CFG = {
  easy:   { maxAbs: 20,  useDec: false, useFrac: false, maxDecimals: 0 },
  medium: { maxAbs: 50,  useDec: true,  useFrac: false, maxDecimals: 1 },
  hard:   { maxAbs: 30,  useDec: true,  useFrac: true,  maxDecimals: 1 }
};

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[rand(0, arr.length - 1)]; }

function randomNumber(cfg, forceNegative) {
  const types = ['int'];
  if (cfg.useDec) types.push('dec');
  if (cfg.useFrac) types.push('frac');
  const t = pick(types);

  if (t === 'int') {
    let v = rand(1, cfg.maxAbs);
    if (forceNegative || Math.random() < 0.5) v = -v;
    return makeFrac(v, 1);
  }
  if (t === 'dec') {
    const intPart = rand(1, Math.min(cfg.maxAbs, 20));
    const decimals = rand(1, Math.max(1, cfg.maxDecimals));
    const factor = Math.pow(10, decimals);
    const fracPart = rand(1, factor - 1);
    let i = intPart * factor + fracPart;
    if (forceNegative || Math.random() < 0.5) i = -i;
    return makeFrac(i, factor);
  }
  const d = rand(2, 9);
  let n = rand(1, d - 1);
  if (forceNegative || Math.random() < 0.5) n = -n;
  return makeFrac(n, d);
}

function randomNonZero(cfg, forceNegative) {
  for (let k = 0; k < 50; k++) {
    const v = randomNumber(cfg, forceNegative);
    if (!isZero(v)) return v;
  }
  return makeFrac(forceNegative ? -3 : 3, 1);
}

function makeNegative(f) {
  if (isZero(f)) return f;
  return { n: -Math.abs(f.n), d: f.d };
}

// Гарантирует хотя бы одно отрицательное среди a и b
function ensureOneNegative(a, b) {
  if (isNegative(a) || isNegative(b)) return { a, b };
  return { a, b: makeNegative(b) };
}

// Одно действие. Гарантирует: хотя бы одно число отрицательное.
function oneOp(cfg, ops) {
  const op = pick(ops);
  const a = randomNumber(cfg, false);
  let b;
  if (op === '+' || op === '-') b = randomNumber(cfg, false);
  else b = randomNonZero(cfg, false);

  const fixed = ensureOneNegative(a, b);
  return { a: fixed.a, b: fixed.b, op };
}

function computeOne(a, b, op) {
  if (op === '+') return addF(a, b);
  if (op === '-') return subF(a, b);
  if (op === '·') return mulF(a, b);
  if (op === ':') {
    if (isZero(b)) return null;
    return divF(a, b);
  }
  return null;
}

// «Определи знак» — одно действие, ВСЕ ЧЕТЫРЕ операции, результат ненулевой
function makeSignTask(cfg) {
  const ops = ['+', '-', '·', ':'];
  for (let k = 0; k < 300; k++) {
    const t = oneOp(cfg, ops);
    if (!isNegative(t.a) && !isNegative(t.b)) continue;
    const res = computeOne(t.a, t.b, t.op);
    if (!res || isZero(res)) continue;
    return t;
  }
  return { a: makeFrac(-7, 1), b: makeFrac(3, 1), op: '+' };
}

// «Вычисли» — одно или два действия; набор операций зависит от раздела
function makeCalcTask(cfg, section) {
  let opsFirst, opsSecond;
  if (section === 'addsub') {
    opsFirst = ['+', '-'];
    opsSecond = ['+', '-'];
  } else if (section === 'muldiv') {
    opsFirst = ['·', ':'];
    opsSecond = ['·', ':'];
  } else {
    opsFirst = ['+', '-', '·', ':'];
    opsSecond = ['+', '-', '·', ':'];
  }

  const useTwo = cfg.useFrac && Math.random() < 0.4;

  if (!useTwo) {
    return { kind: 'one', data: oneOp(cfg, opsFirst) };
  }

  const op1 = pick(opsFirst);
  const op2 = pick(opsSecond);
  let a = randomNumber(cfg, false);
  let b = (op1 === '·' || op1 === ':') ? randomNonZero(cfg, false) : randomNumber(cfg, false);
  let c = (op2 === '·' || op2 === ':') ? randomNonZero(cfg, false) : randomNumber(cfg, false);

  if (isPositive(a) && isPositive(b) && isPositive(c)) {
    c = makeNegative(c);
  }

  return { kind: 'two', data: { a, b, c, op1, op2 } };
}

function buildSet(total, taskType, section, level) {
  const cfg = LEVEL_CFG[level];
  const set = [];
  for (let i = 0; i < total; i++) {
    if (taskType === 'sign') {
      // «Определи знак» — всегда все четыре действия, раздел игнорируется
      set.push({ kind: 'sign', data: makeSignTask(cfg) });
    } else {
      set.push(makeCalcTask(cfg, section));
    }
  }
  return shuffle(set);
}

function computeTask(t) {
  if (t.kind === 'sign' || t.kind === 'one') {
    return computeOne(t.data.a, t.data.b, t.data.op);
  }
  const { a, b, c, op1, op2 } = t.data;
  const step1 = computeOne(a, b, op1);
  if (!step1) return null;
  return computeOne(step1, c, op2);
}

// ==========================================================
//  ОТОБРАЖЕНИЕ С ПРАВИЛОМ СКОБОК
// ==========================================================
function numStr(f) { return fracToStr(f); }

function wrapHTML(f, afterOp) {
  const s = numStr(f);
  if (afterOp && f.n < 0) return `(${s})`;
  return s;
}

function opSym(op) {
  if (op === '·') return '·';
  if (op === ':') return ':';
  return op;
}

function exprHTML(t) {
  if (t.kind === 'sign' || t.kind === 'one') {
    const { a, b, op } = t.data;
    return `${numStr(a)} ${opSym(op)} ${wrapHTML(b, true)}`;
  }
  const { a, b, c, op1, op2 } = t.data;
  const s1 = opSym(op1);
  const s2 = opSym(op2);
  const prio = (o) => (o === '·' || o === ':') ? 2 : 1;
  const bStr = wrapHTML(b, true);
  const cStr = wrapHTML(c, true);
  if (prio(op1) < prio(op2)) {
    return `(${numStr(a)} ${s1} ${bStr}) ${s2} ${cStr}`;
  }
  return `${numStr(a)} ${s1} ${bStr} ${s2} ${cStr}`;
}

// ==========================================================
//  СОСТОЯНИЕ
// ==========================================================
const state = {
  mode: 'training',
  taskType: 'calc',
  section: 'addsub',
  level: 'medium',
  count: 10,
  tasks: []
};

const els = {
  taskType: document.getElementById('taskType'),
  sectionLabel: document.getElementById('sectionLabel'),
  section: document.getElementById('section'),
  level: document.getElementById('level'),
  count: document.getElementById('count'),
  solved: document.getElementById('solved'),
  correct: document.getElementById('correct'),
  totalCount: document.getElementById('totalCount'),
  pbar: document.getElementById('pbar'),
  tasks: document.getElementById('tasks'),
  result: document.getElementById('result'),
  trainingWrap: document.getElementById('trainingWrap'),
  quizWrap: document.getElementById('quizWrap'),
  modeTraining: document.getElementById('mode-training'),
  modeQuiz: document.getElementById('mode-quiz'),
  check: document.getElementById('check'),
  reset: document.getElementById('reset'),
  qCurrent: document.getElementById('qCurrent'),
  qTotal: document.getElementById('qTotal'),
  qExpr: document.getElementById('qExpr'),
  qRow: document.getElementById('qRow'),
  qFeedback: document.getElementById('qFeedback')
};

let quizState = null;

function readSettings() {
  state.taskType = els.taskType.value;
  state.section = els.section.value;
  state.level = els.level.value;
  state.count = parseInt(els.count.value, 10);
  els.sectionLabel.classList.toggle('hidden', state.taskType !== 'calc');
}

// ==========================================================
//  ТРЕНИРОВОЧНЫЙ РЕЖИМ
// ==========================================================
function startTraining() {
  state.mode = 'training';
  state.tasks = buildSet(state.count, state.taskType, state.section, state.level);
  els.totalCount.textContent = state.count;
  els.solved.textContent = '0';
  els.correct.textContent = '0';
  els.pbar.style.width = '0%';
  els.result.className = 'result';
  els.result.innerHTML = '';

  els.trainingWrap.classList.remove('hidden');
  els.quizWrap.classList.add('hidden');

  els.tasks.innerHTML = '';
  state.tasks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'task';
    div.dataset.i = i;
    div.innerHTML = `
      <span class="num">${i + 1}.</span>
      <span class="expr">${exprHTML(t)} =</span>
    `;
    if (t.kind === 'sign') {
      const wrap = document.createElement('span');
      wrap.className = 'sign-btns';
      wrap.innerHTML = `
        <button type="button" data-sign="1">+</button>
        <button type="button" data-sign="-1">−</button>
        <button type="button" data-sign="0">0</button>
      `;
      wrap.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          wrap.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
          b.classList.add('sel');
          updateTrainingProgress();
        });
      });
      div.appendChild(wrap);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'ответ';
      inp.autocomplete = 'off';
      inp.addEventListener('input', updateTrainingProgress);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkTraining(); });
      div.appendChild(inp);
    }
    const tail = document.createElement('span');
    tail.innerHTML = `<span class="mark"></span><span class="answer"></span><span class="errtype"></span>`;
    div.appendChild(tail);
    els.tasks.appendChild(div);
  });
}

function readUserAnswerDiv(div) {
  if (div.querySelector('.sign-btns')) {
    const sel = div.querySelector('.sign-btns button.sel');
    if (!sel) return null;
    return { kind: 'sign', value: parseInt(sel.dataset.sign, 10) };
  }
  const inp = div.querySelector('input');
  if (!inp) return null;
  const raw = inp.value.trim();
  if (raw === '') return null;
  return { kind: 'value', value: parseAnswer(raw), raw };
}

function updateTrainingProgress() {
  let solved = 0;
  els.tasks.querySelectorAll('.task').forEach(div => {
    if (readUserAnswerDiv(div)) solved++;
  });
  els.solved.textContent = solved;
  els.pbar.style.width = (solved / state.count * 100) + '%';
}

function classifyError(userVal, truth) {
  if (!userVal || !truth) return 'value';
  return signOf(userVal) === signOf(truth) ? 'calc' : 'sign';
}

function checkTraining() {
  let correct = 0, wrong = 0, empty = 0;
  let signErr = 0, calcErr = 0;

  els.tasks.querySelectorAll('.task').forEach(div => {
    const i = +div.dataset.i;
    const mark = div.querySelector('.mark');
    const ansEl = div.querySelector('.answer');
    const errEl = div.querySelector('.errtype');
    div.classList.remove('ok', 'err');
    mark.textContent = ''; ansEl.textContent = ''; errEl.textContent = '';

    const ua = readUserAnswerDiv(div);
    const truth = computeTask(state.tasks[i]);
    const t = state.tasks[i];

    if (!ua) { empty++; return; }

    if (t.kind === 'sign') {
      const trueSign = signOf(truth);
      if (ua.value === trueSign) {
        correct++;
        div.classList.add('ok');
        mark.textContent = '✓';
      } else {
        wrong++;
        signErr++;
        div.classList.add('err');
        mark.textContent = '✗';
        ansEl.innerHTML = `ответ: <b>${trueSign > 0 ? '+' : trueSign < 0 ? '−' : '0'}</b>`;
        errEl.textContent = 'ошибка знака';
      }
      return;
    }

    const userVal = ua.value;
    if (!userVal) {
      wrong++;
      calcErr++;
      div.classList.add('err');
      mark.textContent = '✗';
      ansEl.innerHTML = `ответ: <b>${fracToStr(truth)}</b>`;
      errEl.textContent = 'не удалось разобрать ответ';
      return;
    }
    if (isEqualF(userVal, truth)) {
      correct++;
      div.classList.add('ok');
      mark.textContent = '✓';
    } else {
      wrong++;
      const cls = classifyError(userVal, truth);
      if (cls === 'sign') signErr++; else calcErr++;
      div.classList.add('err');
      mark.textContent = '✗';
      ansEl.innerHTML = `ответ: <b>${fracToStr(truth)}</b>`;
      errEl.textContent = cls === 'sign' ? 'ошибка знака' : 'ошибка вычисления';
    }
  });

  els.correct.textContent = correct;
  els.solved.textContent = state.count - empty;
  els.pbar.style.width = '100%';

  showTrainingResult(correct, wrong, empty, signErr, calcErr, state.count);
}

function showTrainingResult(correct, wrong, empty, signErr, calcErr, total) {
  const stats = `
    <div class="stats">
      Всего заданий: <b>${total}</b><br>
      Верно: <b>${correct}</b><br>
      Неверно: <b>${wrong}</b><br>
      Без ответа: <b>${empty}</b>
    </div>
    <div class="errsplit">
      <div class="row">
        <span>Ошибки знака: <span class="bad">${signErr}</span></span>
        <span>Ошибки вычисления: <span class="bad">${calcErr}</span></span>
      </div>
    </div>
  `;
  let cls, title;
  if (correct === total) { cls = 'good'; title = '🎉 Отлично! Все задания решены верно!'; }
  else if (correct >= Math.ceil(total * 0.8)) { cls = 'good'; title = 'Хороший результат!'; }
  else if (correct >= Math.ceil(total * 0.5)) { cls = 'warn'; title = 'Есть над чем поработать.'; }
  else { cls = 'bad'; title = 'Нужно потренироваться ещё.'; }
  els.result.className = 'result show ' + cls;
  els.result.innerHTML = title + stats;
}

// ==========================================================
//  ПРОВЕРОЧНЫЙ РЕЖИМ
// ==========================================================
function startQuiz() {
  state.mode = 'quiz';
  state.tasks = buildSet(state.count, state.taskType, state.section, state.level);
  quizState = { idx: 0, correct: 0, wrong: 0, signErr: 0, calcErr: 0, finished: false };
  els.totalCount.textContent = state.count;
  els.solved.textContent = '0';
  els.correct.textContent = '0';
  els.pbar.style.width = '0%';
  els.result.className = 'result';
  els.result.innerHTML = '';

  els.trainingWrap.classList.add('hidden');
  els.quizWrap.classList.remove('hidden');
  els.qTotal.textContent = state.count;
  renderQuizTask();
}

function renderQuizTask() {
  const i = quizState.idx;
  if (i >= state.count) { finishQuiz(); return; }
  const t = state.tasks[i];
  els.qCurrent.textContent = i + 1;
  els.qExpr.textContent = exprHTML(t) + ' =';
  els.qFeedback.textContent = '';
  els.qFeedback.className = 'quiz-feedback';
  els.qRow.innerHTML = '';

  if (t.kind === 'sign') {
    const wrap = document.createElement('div');
    wrap.className = 'quiz-sign-btns';
    wrap.innerHTML = `
      <button type="button" data-sign="1">+</button>
      <button type="button" data-sign="-1">−</button>
      <button type="button" data-sign="0">0</button>
    `;
    wrap.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        wrap.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        submitQuizSign(parseInt(b.dataset.sign, 10));
      });
    });
    els.qRow.appendChild(wrap);
  } else {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'ответ';
    inp.autocomplete = 'off';
    const btn = document.createElement('button');
    btn.textContent = 'Ответить';
    btn.addEventListener('click', () => submitQuizValue(inp.value));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitQuizValue(inp.value); });
    els.qRow.appendChild(inp);
    els.qRow.appendChild(btn);
    setTimeout(() => inp.focus(), 0);
  }
}

function disableQuizRow() {
  els.qRow.querySelectorAll('input, button').forEach(el => { el.disabled = true; });
}

function submitQuizSign(userSign) {
  if (quizState.finished) return;
  const i = quizState.idx;
  const truth = computeTask(state.tasks[i]);
  const trueSign = signOf(truth);
  const ok = userSign === trueSign;

  if (ok) quizState.correct++;
  else { quizState.wrong++; quizState.signErr++; }

  disableQuizRow();
  els.qFeedback.className = 'quiz-feedback ' + (ok ? 'ok' : 'err');
  els.qFeedback.innerHTML = ok
    ? '✓ Верно!'
    : `✗ Неверно. Правильный знак: <span class="small">${trueSign > 0 ? '+' : trueSign < 0 ? '−' : '0'}</span><br><span class="tag">ошибка знака</span>`;

  els.solved.textContent = i + 1;
  els.correct.textContent = quizState.correct;
  els.pbar.style.width = ((i + 1) / state.count * 100) + '%';

  quizState.idx++;
  setTimeout(() => {
    if (quizState.idx < state.count) renderQuizTask();
    else finishQuiz();
  }, 1200);
}

function submitQuizValue(raw) {
  if (quizState.finished) return;
  if (raw.trim() === '') return;
  const i = quizState.idx;
  const truth = computeTask(state.tasks[i]);
  const userVal = parseAnswer(raw);

  let ok = false, errType = '';
  if (!userVal) errType = 'calc';
  else if (isEqualF(userVal, truth)) ok = true;
  else errType = classifyError(userVal, truth);

  if (ok) quizState.correct++;
  else {
    quizState.wrong++;
    if (errType === 'sign') quizState.signErr++;
    else quizState.calcErr++;
  }

  disableQuizRow();
  els.qFeedback.className = 'quiz-feedback ' + (ok ? 'ok' : 'err');
  if (ok) {
    els.qFeedback.innerHTML = '✓ Верно!';
  } else {
    const tag = errType === 'sign' ? 'ошибка знака' : 'ошибка вычисления';
    els.qFeedback.innerHTML =
      `✗ Неверно. Правильный ответ: <span class="small">${fracToStr(truth)}</span><br><span class="tag">${tag}</span>`;
  }

  els.solved.textContent = i + 1;
  els.correct.textContent = quizState.correct;
  els.pbar.style.width = ((i + 1) / state.count * 100) + '%';

  quizState.idx++;
  setTimeout(() => {
    if (quizState.idx < state.count) renderQuizTask();
    else finishQuiz();
  }, 1200);
}

function finishQuiz() {
  quizState.finished = true;
  els.quizWrap.classList.add('hidden');
  const grade = computeGrade(quizState.correct, state.count);
  showQuizResult(quizState.correct, quizState.wrong, quizState.signErr, quizState.calcErr, state.count, grade);
}

function computeGrade(correct, total) {
  if (correct === total) return 5;
  const p = correct / total;
  if (p >= 0.8) return 4;
  if (p >= 0.5) return 3;
  return 2;
}

function showQuizResult(correct, wrong, signErr, calcErr, total, grade) {
  const gradeClass = grade === 5 ? 'g5' : grade === 4 ? 'g4' : grade === 3 ? 'g3' : 'g2';
  const stats = `
    <div class="stats">
      Всего заданий: <b>${total}</b><br>
      Верно: <b>${correct}</b><br>
      Неверно: <b>${wrong}</b>
    </div>
    <div class="errsplit">
      <div class="row">
        <span>Ошибки знака: <span class="bad">${signErr}</span></span>
        <span>Ошибки вычисления: <span class="bad">${calcErr}</span></span>
      </div>
    </div>
    <div class="grade ${gradeClass}">Оценка: ${grade}</div>
  `;
  let cls, title;
  if (correct === total) { cls = 'good'; title = '🎉 Отлично! Все задания решены верно!'; }
  else if (grade === 4) { cls = 'good'; title = 'Хороший результат!'; }
  else if (grade === 3) { cls = 'warn'; title = 'Есть над чем поработать.'; }
  else { cls = 'bad'; title = 'Нужно потренироваться ещё.'; }
  els.result.className = 'result show ' + cls;
  els.result.innerHTML = title + stats;
}

// ==========================================================
//  ПЕРЕКЛЮЧЕНИЕ
// ==========================================================
function setMode(mode) {
  state.mode = mode;
  els.modeTraining.classList.toggle('active', mode === 'training');
  els.modeQuiz.classList.toggle('active', mode === 'quiz');
  if (mode === 'training') startTraining();
  else startQuiz();
}

function rebuild() {
  readSettings();
  if (state.mode === 'training') startTraining();
  else startQuiz();
}

// ==========================================================
//  ОБРАБОТЧИКИ
// ==========================================================
els.taskType.addEventListener('change', rebuild);
els.section.addEventListener('change', rebuild);
els.level.addEventListener('change', rebuild);
els.count.addEventListener('change', rebuild);
els.check.addEventListener('click', checkTraining);
els.reset.addEventListener('click', startTraining);
els.modeTraining.addEventListener('click', () => setMode('training'));
els.modeQuiz.addEventListener('click', () => setMode('quiz'));

// старт
readSettings();
startTraining();
</script>
</body>
</html>
