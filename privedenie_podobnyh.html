<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приведение подобных — проверка</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#172b45;font:18px system-ui}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:20px;margin:20px 0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px} .item{display:flex;align-items:center;gap:8px;border:1px solid #d6dfeb;padding:10px;border-radius:10px;flex-wrap:wrap}.item input{width:140px;flex:1;min-width:90px;font:inherit;padding:9px;border:1px solid #aab9cb;border-radius:7px}button{background:#245ca8;color:white;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}.ok{background:#e2f6e8}.bad{background:#ffe5e5}.msg{width:100%;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap}progress{width:100%;height:20px}h1{font-size:30px}small{color:#52647a}</style><main><h1>Приведение подобных слагаемых</h1><p>Сиротина · 7 класс · задание 13, стр. 17–18</p><section>Открой распечатку. Реши пример и введи ответ напротив его номера. Например: <b>3x-2y</b> или <b>-2y+3x</b>. Если всё сократилось, введи 0. Используй латинские буквы.</section><p id="total"></p><progress id="progress" max="55" value="0"></progress><nav id="nav"></nav><div id="blocks"></div><button id="all">Проверить всё</button> <button id="reset">Начать заново</button></main><script>const keys=[[{"a": 13}, {"b": 9}, {"m": 11}, {"e": 2}, {"k": 55}, {"s": 21}, {"y": 7}, {"p": 3}, {"n": 4}, {"h": 12}, {}, {"a": 29}, {"k": 7}, {"z": 91}, {"e": 9}], [{"d": 1, "c": 7}, {"a": 3, "q": 6}, {"": 3, "h": 2, "s": 8}, {"": 10, "u": 7}, {"": 2, "g": 3, "f": 4}, {"": -6, "p": -1, "w": 18}, {}, {"": -1, "m": 12, "n": 13}, {"": -4, "a": 1, "h": -4}, {"": -11, "k": 1, "d": 14}, {"c": -3}, {"x": 2}, {"m": -2}, {"t": -2}, {"u": 1}], [{"a": -5, "h": 8}, {"s": -9, "d": -3}, {"y": -14, "f": 6}, {"": 2, "q": -8, "n": 3}, {"": -16, "c": -2}, {}, {"u": 1, "n": -24}, {"a": -1, "b": -3}, {"y": -6, "x": -2, "z": 4}, {"": 5, "m": -9, "v": -9}, {"": -22, "r": -5}, {"": -33, "n": -20}, {"": 81, "s": 26}, {"v": -63, "y": 45}, {"k": -19, "h": 18}], [{"": -12, "b": -18, "a": -14}, {"": -26, "p": -24, "h": -14}, {"": 12, "c": -19, "d": 5}, {"": -14, "x": -1, "y": -2}, {"": -7, "r": -11, "s": 7}, {"": -2, "b": -21, "a": -11}, {"": 4, "m": -12, "n": -7, "s": -6, "d": 4}, {"": -8, "r": -7, "h": -5, "f": -3, "d": 3, "c": 4}, {"h": -1, "n": -3, "m": -2, "v": -2}, {"": -1, "c": -1, "b": -4}]];const letters=['А','Б','В','Г'];let saved={};try{saved=JSON.parse(localStorage.getItem('sirotina13answers')||'{}')}catch(e){}const rows=[];function parse(v){v=v.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/[ахсуреокмт]/g,c=>({а:'a',х:'x',с:'c',у:'y',р:'p',е:'e',о:'o',к:'k',м:'m',т:'t'}[c]));if(!v)return null;if(v==='0')return {};if(!/^[+-]/.test(v))v='+'+v;let chunks=v.match(/[+-](?:\d+[a-z]?|[a-z])/g);if(!chunks||chunks.join('')!==v)return null;let d={};for(let t of chunks){let m=t.match(/^([+-])(\d*)([a-z]?)$/),k=m[3],n=Number(m[2]||1)*(m[1]==='-'?-1:1);if(!n||Object.hasOwn(d,k))return null;d[k]=n}return d}function equal(a,b){return a&&Object.keys(a).length===Object.keys(b).length&&Object.keys(b).every(k=>a[k]===b[k])}function update(){let n=rows.filter(r=>r.el.classList.contains('ok')).length;total.textContent='Верно: '+n+' из 55';progress.value=n;for(let i=0;i<4;i++){document.getElementById('count'+i).textContent=rows.filter(r=>r.b===i&&r.el.classList.contains('ok')).length+' из '+keys[i].length}}function check(r){let v=r.input.value;r.el.classList.remove('ok','bad');if(!v.trim()){r.msg.textContent='Введите ответ';return}let ok=equal(parse(v),r.key);r.el.classList.add(ok?'ok':'bad');r.msg.textContent=ok?'Верно!':'Проверь вычисления и приведи все подобные.'}function save(){try{localStorage.setItem('sirotina13answers',JSON.stringify(saved))}catch(e){}}keys.forEach((ks,b)=>{let link=document.createElement('button');link.textContent='Блок '+letters[b];link.onclick=()=>document.getElementById('b'+b).scrollIntoView({behavior:'smooth'});nav.append(link);let sec=document.createElement('section');sec.id='b'+b;sec.innerHTML=`<h2>Блок ${letters[b]} <small id="count${b}"></small></h2><div class="grid"></div>`;blocks.append(sec);ks.forEach((key,i)=>{let el=document.createElement('div');el.className='item';el.innerHTML=`<b>${i+1})</b><input aria-label="Блок ${letters[b]}, пример ${i+1}" placeholder="Ответ" autocomplete="off"><button aria-label="Проверить">✓</button><span class="msg" aria-live="polite"></span>`;sec.querySelector('.grid').append(el);let input=el.querySelector('input'),msg=el.querySelector('.msg'),id=b+'-'+i,r={el,input,msg,key,b};rows.push(r);input.value=saved[id]||'';input.oninput=()=>{saved[id]=input.value;save();el.classList.remove('ok','bad');msg.textContent='';update()};el.querySelector('button').onclick=()=>{check(r);update()};input.onkeydown=e=>{if(e.key==='Enter'){check(r);update()}};if(input.value)check(r)});let btn=document.createElement('button');btn.style.marginTop='14px';btn.textContent='Проверить блок';btn.onclick=()=>{rows.filter(r=>r.b===b).forEach(check);update()};sec.append(btn)});all.onclick=()=>{rows.forEach(check);update()};reset.onclick=()=>{if(confirm('Удалить все введённые ответы?')){saved={};save();rows.forEach(r=>{r.input.value='';r.el.classList.remove('ok','bad');r.msg.textContent=''});update()}};update();</script></html>
